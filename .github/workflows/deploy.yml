# deploy — main 푸시(=PR 머지)마다 EC2 에 SSH 로 배포한다 (스펙 007 §3).
# Secrets: EC2_HOST·EC2_USER·EC2_SSH_KEY (기존 be·fe 레포와 같은 값).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/marketlens
            # 가드 — 토큰 없이 뜨면 저장 루프가 꺼진 채 조용히 데이터를 잃는다.
            # 값은 출력하지 않는다: 존재·비어있지 않음만 확인.
            if [ ! -f server/.env ]; then
              echo "server/.env 가 없다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^INFLUX_TOKEN=.' server/.env; then
              echo "INFLUX_TOKEN 이 비어 있다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^S3_BUCKET=.' server/.env; then
              echo "S3_BUCKET 이 비어 있다 — 배포 중단"; exit 1
            fi
            # pull 대신 미러 동기화 — 서버 쪽에 어떤 로컬 커밋·갈래가 있어도 main 을 그대로 따른다
            git fetch origin main
            git reset --hard origin/main
            # WEB_PORT 는 루트 .env, INFLUX_TOKEN 치환은 server/.env 에서.
            # --env-file 명시 시 기본 ./.env 자동 로드가 꺼지므로 둘 다 적는다.
            docker compose --env-file .env --env-file server/.env up -d --build
            # 오래된 레이어가 EC2 디스크를 채우지 않게
            docker image prune -f

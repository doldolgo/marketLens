# deploy — main 푸시(=PR 머지)마다 EC2 3대에 SSH 로 배포한다 (스펙 007 §3 · 021 §3.3).
# 박스 순서 data → collect → serve: 저장소가 먼저 떠야 수집이 붙고, 수집이 떠야 nginx 가 업스트림을 푼다.
# job 3개를 needs 로 이었다 — 한 박스가 실패하면 뒤 박스는 돌지 않고, Actions 화면에서 어느 박스가 죽었는지 바로 보인다.
# Secrets: EC2_HOST_DATA·EC2_HOST_COLLECT·EC2_HOST_SERVE(박스별 공인 IP) + 공용 EC2_USER·EC2_SSH_KEY. 옛 EC2_HOST 는 안 쓴다.
# 각 박스 스크립트는 같은 뼈대(가드 → 미러 동기화 → 자기 profile 만 up --build → prune)이고 가드 키만 다르다.
# prune 은 이미지와 빌드 캐시 둘 다 — image prune 만으로는 빌드 캐시가 배포마다 쌓여 serve(8GB)가
# 2026-10-02 연속 배포 셋 뒤 디스크 경보(80%)를 넘었다. 지금 이미지가 쓰는 캐시는 남아 다음 빌드도 캐시를 탄다.
# serve 만 up 뒤에 caddy 다시 읽기(027)와 관리자 터널(030 — 토큰 파일이 있을 때만 profile tunnel)이 붙는다.
# 가드는 값을 출력하지 않는다: 존재·비어있지 않음만 `grep -q '^KEY=.'` 로 본다.
name: Deploy

on:
  push:
    branches: [main]

# 배포는 한 번에 하나(007 §3). 도는 실행은 세 박스를 끝까지 돌고, 그 사이 머지된 푸시는 pending 으로 기다린다.
# pending 은 최신 하나뿐(queue 기본값 single) — 기다리던 실행은 더 새 푸시에 자리를 내주고 취소된다.
# 잃는 커밋은 없다: 스크립트가 트리거 커밋이 아니라 그 순간의 origin/main 을 따르므로 마지막 실행이 main 끝을 배포한다.
# 도는 실행을 끊지 않는다 — 끊으면 박스 사슬이나 up --build 중간에 멈춰 막으려던 반쪽 배포가 남는다.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_DATA }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/marketlens
            # 가드 — Influx 첫 기동 admin 토큰이 server/.env 의 INFLUX_TOKEN 이다. 비면 setup 이 깨진다.
            if [ ! -f server/.env ]; then
              echo "server/.env 가 없다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^INFLUX_TOKEN=.' server/.env; then
              echo "INFLUX_TOKEN 이 비어 있다 — 배포 중단"; exit 1
            fi
            # pull 대신 미러 동기화 — 서버 쪽에 어떤 로컬 커밋·갈래가 있어도 main 을 그대로 따른다
            git fetch origin main
            git reset --hard origin/main
            # data 박스는 redis·influxdb 만. 이미지는 공식 이미지라 --build 는 아무것도 안 하지만 뼈대를 같게 둔다.
            docker compose --profile data --env-file .env --env-file server/.env up -d --build
            docker image prune -f
            docker builder prune -f

  collect:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_COLLECT }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/marketlens
            # 가드 — 토큰 없이 뜨면 저장 루프가, 버킷 없이 뜨면 원문 아카이브(010)가 꺼진 채 조용히 데이터를 잃는다.
            # DATA_HOST 가 비면 server 가 자기 박스의 (없는) influxdb·redis 서비스명으로 붙어 조용히 인계·저장을 못 한다.
            if [ ! -f server/.env ]; then
              echo "server/.env 가 없다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^INFLUX_TOKEN=.' server/.env; then
              echo "INFLUX_TOKEN 이 비어 있다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^S3_BUCKET=.' server/.env; then
              echo "S3_BUCKET 이 비어 있다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^DATA_HOST=.' .env; then
              echo "DATA_HOST 가 비어 있다 — 배포 중단"; exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            # collect 는 1 vCPU 라 --build 동안 수집이 느려진다(표 1~2분 지연) — 감수 (021 §3.3)
            docker compose --profile collect --env-file .env --env-file server/.env up -d --build
            # 오래된 레이어가 EC2 디스크를 채우지 않게
            docker image prune -f
            docker builder prune -f

  serve:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_SERVE }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/marketlens
            # 가드 — api 는 INFLUX_TOKEN 으로 data 의 Influx 를 읽고, nginx 는 COLLECT_HOST 로 수집 박스를 푼다.
            if [ ! -f server/.env ]; then
              echo "server/.env 가 없다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^INFLUX_TOKEN=.' server/.env; then
              echo "INFLUX_TOKEN 이 비어 있다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^DATA_HOST=.' .env; then
              echo "DATA_HOST 가 비어 있다 — 배포 중단"; exit 1
            fi
            if ! grep -q '^COLLECT_HOST=.' .env; then
              echo "COLLECT_HOST 가 비어 있다 — 배포 중단"; exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            docker compose --profile serve --env-file .env --env-file server/.env up -d --build
            # 027 — 정의가 안 바뀐 caddy 는 compose 가 다시 만들지 않는다. caddy/ 디렉터리의 새 Caddyfile 을 읽힌다.
            # 깨진 설정이면 여기서 실패하고 돌던 caddy 는 옛 설정으로 계속 돈다 — 곧바로 되돌림 커밋을 머지한다
            # (깨진 파일은 디스크에 남아 다음 caddy 재시작에서 사이트 전체를 내린다).
            docker exec marketlens-caddy caddy reload --config /etc/caddy/Caddyfile
            # 030 — 관리자 터널. 토큰 파일(사람이 런북 admin-access.md 뒤에 둔다)이 비어 있지 않을 때만 띄운다.
            # 공개 up 과 따로 돌린다 — 같은 up 에서 secret 오류가 나면 함께 다시 만들던 web·caddy·api 가 기동 안 된 채 남을 수 있다.
            # --profile tunnel 은 serve 컨테이너를 건드리지 않는다. 실패하면 배포 실패(공개 서비스는 이미 떠 있다).
            # 파일은 크기만 본다(-s) — 소유 65532·0400 이라 이 사용자는 읽을 수 없고, 읽을 일도 없다.
            if [ -s secrets/cloudflared-token ]; then
              docker compose --profile tunnel --env-file .env --env-file server/.env up -d
            else
              echo "tunnel 건너뜀 — secrets/cloudflared-token 이 없거나 비었다"
            fi
            docker image prune -f
            docker builder prune -f

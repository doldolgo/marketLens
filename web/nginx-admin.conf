# MarketLens web — 관리자 server :8081 (스펙 029 §3.1·§3.2). 공개 server(nginx.conf, :80)와 같은 컨테이너·프로세스다.
# 이 파일도 envsubst 템플릿이다(/etc/nginx/templates/admin.conf.template → conf.d/admin.conf) — 치환은 ${COLLECT_HOST} 하나.
# 8081 은 어떤 서비스도 호스트에 게시하지 않고 caddy 도 부르지 않는다 — 들어오는 길(Tunnel)과 로그인(Access)은 030.
# 공개 server 에 server_name 으로 관리자를 가르거나 caddy 에 admin 사이트를 두지 않는 이유: Host·SNI 위조로 로그인을
# 건너뛴다. nginx 는 listen 포트를 먼저 고르므로 탄력 IP 로 `Host: admin.kimptrack.com` 을 보내도 :80 공개 server 에 닿는다.
# 문법 오류·못 푸는 업스트림 이름은 공개 사이트까지 내린다 — 업스트림은 api·${COLLECT_HOST} 둘뿐이고, 이 파일을
# 고친 PR 은 로컬 `nginx -t` 결과를 본문에 적는다(CI 는 문자열만 본다).

# 접속 기록 — 요청마다 JSON 한 줄. email·ip·ray 는 Cloudflare(030)가 넣는 헤더, sfs 는 Sec-Fetch-Site 가 실제로
# 도착하는지 보려고. 이메일·IP 는 개인정보다 — 보존·항목은 후속 처리방침 스펙이 옮긴다.
log_format admin_json escape=json
    '{"time":"$time_iso8601","email":"$http_cf_access_authenticated_user_email","ip":"$http_cf_connecting_ip",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"rt":$request_time,'
    '"ray":"$http_cf_ray","sfs":"$http_sec_fetch_site"}';

# 교차 사이트 차단 — 백엔드로 넘기는 경로는 same-origin·none·빈 값(헤더 없음)만 통과, 나머지(same-site·cross-site)는 403.
# kimptrack.com 과 admin.kimptrack.com 은 같은 사이트라 쿠키 SameSite 로는 서로의 요청을 못 막는다.
map $http_sec_fetch_site $admin_sfs_ok {
    default 0;
    "" 1;
    same-origin 1;
    none 1;
}

server {
    listen 8081;
    server_name _;
    server_tokens off;
    # 기록은 이 파일 하나(이미지가 디렉터리를 만들고 compose 가 호스트 ./logs/admin 을 바인드). 회전은 030 런북
    access_log /var/log/nginx-admin/access.log admin_json;

    # 아래 세 종류는 location 이 같은 지시어를 하나라도 두면 여기 것이 상속되지 않는다 — 그 location 에서 반복한다.
    # 모든 응답(오류 포함)에 액자 금지.
    add_header X-Frame-Options DENY always;
    # 백엔드로 넘길 때: 접두 제거 뒤 헤더 4개는 공개와 같고, Cookie·Access JWT 는 비운다(백엔드는 쓰지 않는다 —
    # 사설망 평문으로 흘리지 않는다). X-Refresh-Token 은 그대로 간다.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_set_header Cf-Access-Jwt-Assertion "";
    # 앱이 CORS `*` 를 붙인다(수집기·api 같은 앱) — 다른 출처의 스크립트가 응답을 읽지 못하게 지운다
    proxy_hide_header Access-Control-Allow-Origin;

    # 교차 사이트 403 은 앱 오류와 같은 JSON 으로
    error_page 403 @forbidden;
    location @forbidden {
        types { }
        default_type application/json;
        add_header X-Frame-Options DENY always;
        return 403 '{"error":{"code":"forbidden","message":"Forbidden","detail":null}}';
    }

    # 관리자 화면 — 공개 root(/usr/share/nginx/html) 밖이라 공개 server 로는 받아 갈 수 없다. 인라인 스크립트·스타일이
    # 없으므로 CSP 는 자기 출처만. 화면이 API 계약을 따르므로 캐시하지 않는다(공개 index.html 과 같은 이유).
    location / {
        root /usr/share/nginx/admin;
        index index.html;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    # API 문서 두 쪽 — 교차 사이트 검사 예외(로그인 뒤 돌아오는 이동은 same-origin 이 아니다). 문서가 부르는
    # /api/openapi.json 은 같은 출처 요청이라 아래 /api/ 의 검사를 통과한다.
    location = /api/docs {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
    }
    location = /api/redoc {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
    }

    # 화면의 10초 폴링(수집기 쪽) — 기록하지 않는다
    location = /api/health {
        if ($admin_sfs_ok = 0) { return 403; }
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
    }
    location = /api/health/collect {
        if ($admin_sfs_ok = 0) { return 403; }
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
    }

    # api 로 — 028 이전의 분기 그대로(016·017·018·022). 정규식 location 없이 접두·정확 일치로 쓴다(접두라
    # streaks/bulk 같은 하위 경로도 따라간다). 읽기 제한은 기본 60초 — 그보다 긴 history 조회는 504.
    location /api/history/premium {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }
    location /api/history/streaks {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }
    location /api/history/candles {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }
    location = /api/spreads {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }
    location = /api/landing {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }
    # WebSocket 업그레이드 — proxy_set_header 를 두므로 server 수준 여섯 줄을 여기서 반복한다
    location /api/ws/ {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header Cf-Access-Jwt-Assertion "";
    }

    # 나머지 /api 는 전부 수집기 — 공개(028)와 달리 허용 목록이 없다. 로그인한 사람만 온다(030).
    location /api/ {
        if ($admin_sfs_ok = 0) { return 403; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
    }

    # api 의 /health·/admin/status — 경로를 통째로 바꾼다. 화면의 10초 폴링이라 기록하지 않는다
    location = /svc/api/health {
        if ($admin_sfs_ok = 0) { return 403; }
        access_log off;
        rewrite ^ /health break;
        proxy_pass http://api:8000;
    }
    location = /svc/api/admin/status {
        if ($admin_sfs_ok = 0) { return 403; }
        access_log off;
        rewrite ^ /admin/status break;
        proxy_pass http://api:8000;
    }
}

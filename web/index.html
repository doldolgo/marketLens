<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 033 — 화면 분석(Clarity) 동의 안내 띠·불러올지 판단. 앱 모듈보다 앞에 둔다(defer 는 문서 순서대로 실행된다 — 대기열이 셸의 첫 태그보다 먼저) -->
    <script defer src="/clarity.js"></script>
    <!-- 052 — 화면 영역 이용 통계(동의한 방문자만 — clarity.js 와 같은 판정). 영역은 data-area, 탭 바뀜은 App 의 kt:tab -->
    <script defer src="/attention.js"></script>
    <script defer src="/replay.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 072 §3.9 — 정적 페이지와 같은 세 가지: 휴대폰 주소창 색, iOS 가 가로로 돌릴 때 글자를 키우지 않게,
         어두운 화면이라고 알려 체크박스·select·스크롤 막대 같은 브라우저 조각도 어둡게 그리게 -->
    <meta name="theme-color" content="#161826" />
    <style>html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: dark; }</style>
    <title>KimpTrack</title>
    <!-- 022 — 대시보드는 자바스크립트로 그리는 화면이라 검색에는 랜딩(/)만 올린다. 링크는 따라가게 둔다(follow).
         noindex 는 정적으로만 둔다 — 스크립트로 바꾸면 구글이 렌더링 전에 건너뛴다. 공유 미리보기용 og 는 랜딩과 같은 그림 -->
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="업비트·빗썸과 바이낸스·바이비트·비트겟·OKX 사이 코인별 김프·역프와 입출금 상태를 매초 보여 주는 KimpTrack 실시간 김프 표입니다." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KimpTrack" />
    <meta property="og:title" content="KimpTrack - 실시간 김프 표" />
    <meta property="og:description" content="업비트·빗썸과 바이낸스·바이비트·비트겟·OKX 사이 코인별 김프·역프와 입출금 상태를 매초 보여 주는 KimpTrack 실시간 김프 표입니다." />
    <meta property="og:url" content="https://kimptrack.com/app/" />
    <meta property="og:image" content="https://kimptrack.com/landing/og-v4.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root" data-clarity-unmask="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

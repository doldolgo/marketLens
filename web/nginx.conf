# MarketLens web — 정적 서빙 + 공개 API 허용 목록 프록시 (스펙 007 §3·028)
# 021 — 이 파일은 nginx 이미지의 envsubst 템플릿이다(/etc/nginx/templates/default.conf.template → conf.d/default.conf).
# 치환되는 변수는 ${COLLECT_HOST} 하나뿐(compose 가 NGINX_ENVSUBST_FILTER 로 제한) — $http_host 같은 nginx 변수는 그대로 남는다.
server {
    listen 80;
    server_name _;
    # 028 — 응답 헤더·오류 페이지에 nginx 버전을 싣지 않는다(Server: nginx)
    server_tokens off;
    # 027 — 접속 기록은 caddy 한 곳에서(IP·검색어·헤더를 지운 채). nginx 기본 형식의 마지막 칸이 caddy 가 넣은
    # 원 IP(X-Forwarded-For)라 여기서는 끈다. 오류 로그는 남긴다.
    access_log off;

    root /usr/share/nginx/html;
    index index.html;
    # 301 을 상대 경로로 — 호스트 포트가 80 이 아닐 때(WEB_PORT) 절대 주소가 포트를 잃는다 (022)
    absolute_redirect off;
    # 정적 파일은 빌드 때 만든 .gz 를 그대로 준다(web/Dockerfile — 요청마다 압축하지 않는다). 즉석 압축(gzip on)은
    # 켜지 않으므로 앱이 이미 압축한 /api 응답을 다시 압축하지 않는다 (007)
    gzip_static on;
    # 앞단 caddy 가 요청에 Via 를 붙여 여기 오는 요청은 전부 '프록시를 거친 요청' 이다 — 기본값(off)이면 gzip_static 이
    # .gz 를 주지 않는다(2026-09-30 운영 확인). 즉석 압축이 꺼져 있어 이 줄은 미리 압축한 정적 파일에만 걸린다 (007)
    gzip_proxied any;
    # .gz 가 있는 정적 파일 응답에 Vary: Accept-Encoding — 중간 캐시가 gzip 을 못 받는 요청에 압축본을 주지 않게 (007)
    gzip_vary on;
    # 022 — 없는 경로는 한국어 안내 페이지(상태 404 그대로, noindex). /api 의 `return 404 '{json}'` 은 본문이 있어 가로채지 않는다
    error_page 404 /404.html;

    # 028 — 공개 /api 는 허용 목록 여섯만 백엔드로 넘긴다. 전부 정확 일치(=)라 끝에 / 가 붙거나 하위 경로면
    # 아래 /api/ 의 404 로 떨어지고, 백엔드에 새 경로가 생겨도 여기 한 줄을 더하기 전까지는 숨는다.
    # 정규식 location 은 두지 않는다 — 정규식은 접두 location(/api/)보다 먼저 이겨 이 목록을 우회한다.
    # 넘기는 모양은 하나로 고정: rewrite 가 nginx 가 정규화한 경로(%XX·./..·연속 / 처리 뒤)에서 /api 를 떼고,
    # URI 없는 proxy_pass 가 그 경로를 넘긴다(break 라 쿼리스트링은 그대로 따라간다). 정확 일치에
    # `proxy_pass http://…:8000/;` 를 붙이면 경로가 / 로 바뀌고, rewrite 가 없으면 원문 URI 가 넘어간다.

    # 수집기(collect 박스)로 — 업스트림 호스트는 기동 시 COLLECT_HOST 로 치환된다(021, compose 기본값 = 서비스명
    # server). 사설 IP 가 바뀌면 루트 .env 를 고치고 web 을 재기동한다. /api/history/events 는 진행 중 사건을
    # 메모리에서 읽으므로 수집기다(016).
    location = /api/health {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health/collect {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/history/events {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 050 — 입출금 레이더 둘. 감지기 상태·업비트 현재가가 수집기 메모리라 수집기다.
    location = /api/flow/netflow {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/flow/recent {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 같은 박스의 api 로 — Influx 봉(016)·랜딩 요약(022)·스프레드 WebSocket(017). api 가 죽으면 이 셋만 502 이고
    # 수집기로 가는 셋과 랜딩 본문(landing.html)은 그대로다.
    location = /api/history/candles {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 022 — robots.txt 가 이 경로만 열어 검색 로봇이 랜딩을 그릴 때 실데이터를 받는다. JSON 자체는 색인하지 않는다
    location = /api/landing {
        add_header X-Robots-Tag "noindex" always;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 052 — 화면 영역 이용 통계 비콘(동의한 브라우저의 sendBeacon). POST 만 — location 안 return 만 쓰는 if 라 안전하다.
    # 몸통 4k 를 넘으면 nginx 기본 413(비콘은 응답을 읽지 않는다). X-Client-IP 는 caddy 가 넣은 X-Forwarded-For 그대로 —
    # caddy 에 trusted_proxies 가 없어 그 값이 방문자 IP 하나다. api 는 그 IP 를 10분 셈 표(메모리)에만 쓴다.
    # 접속 기록은 server 수준에서 이미 꺼져 있고, caddy 도 이 경로를 기록하지 않는다(027)
    location = /api/attention {
        if ($request_method != POST) { return 405; }
        client_max_body_size 4k;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP $http_x_forwarded_for;
    }
    # 017 — WebSocket 업그레이드. 접두 location(/api/ws/)이 아닌 이유: api 에 새 /ws/* 가 생기면 자동 공개되고
    # /api/ws 가 nginx 의 자동 301 을 받는다. 읽기 타임아웃은 기본(60초) — 서버가 1초마다 보내므로 안 끊긴다.
    location = /api/ws/spreads {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 048 — 현선갭 표 WebSocket. spreads 와 같은 모양(정확 일치·접두 제거·업그레이드 헤더), 접두 location 은 만들지 않는다
    location = /api/ws/gap {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 /api 는 메서드와 무관하게 백엔드에 넘기지 않고 앱의 404 와 같은 JSON 으로 답한다(028 §3.2).
    # 403 이 아닌 이유 — 경로가 있다는 사실을 드러낸다. types {} 가 확장자별 MIME 추정을 꺼
    # /api/x.html·/api/x.js 도 application/json 이다. 닫힌 경로는 029 전까지 박스 안에서 부른다.
    location = /api {
        types { }
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Not Found","detail":null}}';
    }
    location /api/ {
        types { }
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Not Found","detail":null}}';
    }

    # 053 — 공개 페이지(랜딩·대시보드·처리방침·검색어 페이지 둘)는 관리자 화면(admin.kimptrack.com)의 '화면 이용' 덮어 보기
    # 틀 안에서만 뜰 수 있다 — 그 밖의 사이트가 틀로 씌우지 못하게(클릭재킹) CSP frame-ancestors 하나. CSP 가 없던 랜딩·대시보드는
    # 이 지시어 하나짜리 CSP 이고, 세 정적 페이지는 같은 문자열 끝의 frame-ancestors 만 이 값이다. X-Frame-Options 는 두지 않는다
    # (DENY·SAMEORIGIN 이면 CSP 와 달라 브라우저가 관리자 틀을 막는다).
    # index.html 은 캐시하지 않는다. 배포는 FE·BE 를 한 번에 바꾸는데, 캐시된 셸이 남으면
    # 열려 있던 탭이 구 번들로 새 API 계약을 계속 친다(응답 키가 사라져도 TS 가 못 잡는다).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.kimptrack.com" always;
    }

    # 해시가 박힌 자산은 영구 캐시 — 내용이 바뀌면 파일명이 바뀌므로 무효화가 필요 없다.
    # `always` 를 붙이지 않는다: 그러면 404 에도 1년 immutable 이 붙어, 배포 직전 셸을 든
    # 브라우저가 사라진 번들의 404 를 1년간 캐시한다(되돌릴 수 없다). 200·304 는 그대로 받는다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 022 — / 는 정적 랜딩(landing.html). 옛 대시보드 링크만 쿼리를 들고 /app/ 로 301 — tab 이 있거나, 기본 탭(스프레드)이라
    # tab 없이 s.* 키만 남은 링크(/?s.q=xrp). utm·광고 클릭 id 같은 다른 쿼리로 온 첫 방문자는 랜딩을 그대로 본다
    # (canonical 이 주소를 / 하나로 모은다). location 이 아니라 if 안의 정규식이라 허용 목록(028)을 우회하지 않는다.
    # 랜딩은 매번 다시 확인한다(no-cache — 바뀌지 않았으면 304) — 스크립트가 /api/landing 계약을 따르므로 index.html 과
    # 같은 이유. no-store 가 아닌 이유: 뒤로 가기 캐시(bfcache)에 들어가게. 돌아오면 스크립트가 곧바로 새 값을 받는다.
    location = / {
        if ($args ~ "(^|&)(tab|s\.[a-z]+)=") { return 301 /app/$is_args$args; }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.kimptrack.com" always;
        try_files /landing.html =404;
    }
    # 랜딩 파일을 직접 부른 주소(/landing.html·/app/landing.html)는 / 로 모은다 — 같은 본문이 여러 주소로 수집되지 않게 (022)
    location = /landing.html { return 301 /; }
    location = /app/landing.html { return 301 /; }
    location = /app { return 301 /app/; }

    # 032 — 개인정보 처리방침. 외부 자원을 부르지 않는 페이지라 CSP 로 브라우저가 그것을 지키게 한다(인라인
    # 스타일·스크립트와 같은 출처 그림(favicon)만). 052 — 같은 출처 스크립트는 /attention.js 하나('self')이고 그 비콘이
    # /api/attention 으로 간다(connect-src 'self' — sendBeacon 은 connect-src 를 따른다). 세 정적 페이지가 같은 문자열이다.
    # no-cache 는 랜딩과 같은 이유 — 고치면 다음 방문에 바로 보이고 그대로면 304.
    # 파일 이름으로 부른 두 주소는 /privacy 로 모은다 — /app/privacy.html 은 아래 /app/ alias 로 CSP 없이 200 이 나가기 때문이다
    location = /privacy {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://admin.kimptrack.com" always;
        try_files /privacy.html =404;
    }
    location = /privacy.html { return 301 /privacy; }
    location = /app/privacy.html { return 301 /privacy; }

    # 044 — 검색어 페이지 둘(김프 차트·김프 히스토리). privacy 와 같은 모양(번들 밖 정적 한 파일·no-cache·CSP·파일 이름 주소는 301).
    # CSP 는 privacy 와 같은 문자열(052) — kimp-history 는 /api/landing 도 같은 connect-src 'self' 로 부른다
    location = /kimp-chart {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://admin.kimptrack.com" always;
        try_files /kimp-chart.html =404;
    }
    location = /kimp-chart.html { return 301 /kimp-chart; }
    location = /app/kimp-chart.html { return 301 /kimp-chart; }
    location = /kimp-history {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://admin.kimptrack.com" always;
        try_files /kimp-history.html =404;
    }
    location = /kimp-history.html { return 301 /kimp-history; }
    location = /app/kimp-history.html { return 301 /kimp-history; }

    # 033 — 화면 분석 설정(Clarity ID·켤 페이지·안내 판)과 동의 안내 띠가 든 파일. 매번 다시 확인한다(no-cache — 그대로면 304) —
    # ID 를 비우거나 판을 올린 배포가 다음 페이지 로드부터 바로 따르게. 대시보드는 /app/clarity.js(아래 /app/ — no-store)로 같은 파일을 받는다
    location = /clarity.js {
        add_header Cache-Control "no-cache" always;
    }
    # 052 — 화면 영역 이용 통계 스크립트(안내 판 값이 들어 있다). clarity.js 와 같은 이유·같은 꼴. 대시보드는 /app/attention.js(아래 /app/)
    location = /attention.js {
        add_header Cache-Control "no-cache" always;
    }

    # 022 — 대시보드는 /app/ 아래. 빌드 결과(dist)는 그대로 root 에 있고 alias 로 접두만 벗긴다.
    # /app/assets/ 는 위 /assets/ 와 같은 영구 캐시, 없는 경로는 /app/index.html — SPA fallback.
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /app/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.kimptrack.com" always;
    }
    location /app/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.kimptrack.com" always;
        try_files $uri $uri/ /app/index.html;
    }

    # 그 밖의 루트 경로는 정적 파일(랜딩 이미지·글꼴·robots.txt·sitemap.xml·아이콘·404.html)만 — 없으면 404 (SPA fallback 은 /app/ 에서만)
    location / {
        try_files $uri =404;
    }
}

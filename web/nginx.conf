# MarketLens web — 정적 서빙 + API 프록시 (스펙 007 §3)
# 021 — 이 파일은 nginx 이미지의 envsubst 템플릿이다(/etc/nginx/templates/default.conf.template → conf.d/default.conf).
# 치환되는 변수는 ${COLLECT_HOST} 하나뿐(compose 가 NGINX_ENVSUBST_FILTER 로 제한) — $http_host 같은 nginx 변수는 그대로 남는다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 301 을 상대 경로로 — 호스트 포트가 80 이 아닐 때(WEB_PORT) 절대 주소가 포트를 잃는다 (022)
    absolute_redirect off;

    # /api/* 는 server 로 넘기며 /api 접두를 뗀다 — dev 의 vite proxy 와 같은 규칙.
    # proxy_pass 끝의 / 가 접두 제거를 만든다: /api/health → /health
    location = /api { return 404; }

    # Influx 만 읽는 네 경로는 api 컨테이너로 (스펙 016 §3.3) — 앞부분 일치라 하위 경로(streaks/bulk)·
    # 쿼리스트링을 포함한다. 정규식 location 이 아래 접두 location(/api/) 보다 먼저 잡힌다.
    # /api/history/events 는 여기 없어 server 로 간다 — 진행 중 사건을 메모리에서 읽으므로.
    # proxy_pass 에 URI 가 없으므로 rewrite 가 접두를 뗀다(break 라 args 는 그대로 따라간다).
    # api 가 죽어 있으면 이 네 경로(+ 아래 /api/spreads·/api/ws/)만 502 — 나머지는 server 가 그대로 답한다.
    location ~ ^/api/history/(premium|streaks|candles) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 018 — 스프레드 표 폴링(fallback)도 api 로: api 가 Redis `spreads:latest` 를 그대로 답한다.
    # 정확 일치(=)라 쿼리스트링은 무관하게 따라가고 `/api/spreads/…` 하위 경로는 아래 `/api/` 로 간다.
    # 접두 제거는 016 과 같은 rewrite. 이로써 스프레드 탭이 보는 컨테이너는 api 하나다.
    location = /api/spreads {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 017 — WebSocket 푸시는 api 로. 접두 위치라 proxy_pass 의 /ws/ 가 접두를 바꾼다(rewrite 불필요).
    # 읽기 타임아웃은 기본(60초) 그대로 — 서버가 1초마다 메시지를 보내므로 안 끊긴다.
    location /api/ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 021 — 수집 컨테이너는 다른 박스(collect)에 있다. 업스트림 호스트는 기동 시 COLLECT_HOST 로 치환된다
    # (compose 기본값 = 서비스명 server). 사설 IP 가 바뀌면 루트 .env 를 고치고 web 을 재기동한다.
    location /api/ {
        proxy_pass http://${COLLECT_HOST}:8000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html 은 캐시하지 않는다. 배포는 FE·BE 를 한 번에 바꾸는데, 캐시된 셸이 남으면
    # 열려 있던 탭이 구 번들로 새 API 계약을 계속 친다(응답 키가 사라져도 TS 가 못 잡는다).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # 해시가 박힌 자산은 영구 캐시 — 내용이 바뀌면 파일명이 바뀌므로 무효화가 필요 없다.
    # `always` 를 붙이지 않는다: 그러면 404 에도 1년 immutable 이 붙어, 배포 직전 셸을 든
    # 브라우저가 사라진 번들의 404 를 1년간 캐시한다(되돌릴 수 없다). 200·304 는 그대로 받는다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 022 — / 는 정적 랜딩(landing.html). 옛 링크(/?tab=…)는 쿼리를 들고 /app/ 로 301.
    # 랜딩도 캐시하지 않는다 — 티저 스크립트가 /api/spreads 계약을 따르므로 index.html 과 같은 이유.
    location = / {
        if ($args) { return 301 /app/$is_args$args; }
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /landing.html =404;
    }
    location = /app { return 301 /app/; }

    # 022 — 대시보드는 /app/ 아래. 빌드 결과(dist)는 그대로 root 에 있고 alias 로 접두만 벗긴다.
    # /app/assets/ 는 위 /assets/ 와 같은 영구 캐시, 없는 경로는 /app/index.html — SPA fallback.
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /app/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location /app/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /app/index.html;
    }

    # 그 밖의 루트 경로는 정적 파일(랜딩 이미지·robots.txt·favicon)만 — 없으면 404 (SPA fallback 은 /app/ 에서만)
    location / {
        try_files $uri =404;
    }
}

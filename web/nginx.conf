# MarketLens web — 정적 서빙 + 공개 API 허용 목록 프록시 (스펙 007 §3·028)
# 021 — 이 파일은 nginx 이미지의 envsubst 템플릿이다(/etc/nginx/templates/default.conf.template → conf.d/default.conf).
# 치환되는 변수는 ${COLLECT_HOST} 하나뿐(compose 가 NGINX_ENVSUBST_FILTER 로 제한) — $http_host 같은 nginx 변수는 그대로 남는다.
server {
    listen 80;
    server_name _;
    # 028 — 응답 헤더·오류 페이지에 nginx 버전을 싣지 않는다(Server: nginx)
    server_tokens off;
    # 027 — 접속 기록은 caddy 한 곳에서(IP·검색어·헤더를 지운 채). nginx 기본 형식의 마지막 칸이 caddy 가 넣은
    # 원 IP(X-Forwarded-For)라 여기서는 끈다. 오류 로그는 남긴다.
    access_log off;

    root /usr/share/nginx/html;
    index index.html;
    # 301 을 상대 경로로 — 호스트 포트가 80 이 아닐 때(WEB_PORT) 절대 주소가 포트를 잃는다 (022)
    absolute_redirect off;
    # 정적 파일은 빌드 때 만든 .gz 를 그대로 준다(web/Dockerfile — 요청마다 압축하지 않는다). 즉석 압축(gzip on)은
    # 켜지 않고 gzip_proxied 도 기본(off) 그대로라 앱이 이미 압축한 /api 응답을 다시 압축하지 않는다 (007)
    gzip_static on;
    # .gz 가 있는 정적 파일 응답에 Vary: Accept-Encoding — 중간 캐시가 gzip 을 못 받는 요청에 압축본을 주지 않게 (007)
    gzip_vary on;

    # 028 — 공개 /api 는 허용 목록 여섯만 백엔드로 넘긴다. 전부 정확 일치(=)라 끝에 / 가 붙거나 하위 경로면
    # 아래 /api/ 의 404 로 떨어지고, 백엔드에 새 경로가 생겨도 여기 한 줄을 더하기 전까지는 숨는다.
    # 정규식 location 은 두지 않는다 — 정규식은 접두 location(/api/)보다 먼저 이겨 이 목록을 우회한다.
    # 넘기는 모양은 하나로 고정: rewrite 가 nginx 가 정규화한 경로(%XX·./..·연속 / 처리 뒤)에서 /api 를 떼고,
    # URI 없는 proxy_pass 가 그 경로를 넘긴다(break 라 쿼리스트링은 그대로 따라간다). 정확 일치에
    # `proxy_pass http://…:8000/;` 를 붙이면 경로가 / 로 바뀌고, rewrite 가 없으면 원문 URI 가 넘어간다.

    # 수집기(collect 박스)로 — 업스트림 호스트는 기동 시 COLLECT_HOST 로 치환된다(021, compose 기본값 = 서비스명
    # server). 사설 IP 가 바뀌면 루트 .env 를 고치고 web 을 재기동한다. /api/history/events 는 진행 중 사건을
    # 메모리에서 읽으므로 수집기다(016).
    location = /api/health {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/health/collect {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/history/events {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${COLLECT_HOST}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 같은 박스의 api 로 — Influx 봉(016)·랜딩 요약(022)·스프레드 WebSocket(017). api 가 죽으면 이 셋만 502 이고
    # 수집기로 가는 셋과 랜딩 본문(landing.html)은 그대로다.
    location = /api/history/candles {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/landing {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 017 — WebSocket 업그레이드. 접두 location(/api/ws/)이 아닌 이유: api 에 새 /ws/* 가 생기면 자동 공개되고
    # /api/ws 가 nginx 의 자동 301 을 받는다. 읽기 타임아웃은 기본(60초) — 서버가 1초마다 보내므로 안 끊긴다.
    location = /api/ws/spreads {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 /api 는 메서드와 무관하게 백엔드에 넘기지 않고 앱의 404 와 같은 JSON 으로 답한다(028 §3.2).
    # 403 이 아닌 이유 — 경로가 있다는 사실을 드러낸다. types {} 가 확장자별 MIME 추정을 꺼
    # /api/x.html·/api/x.js 도 application/json 이다. 닫힌 경로는 029 전까지 박스 안에서 부른다.
    location = /api {
        types { }
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Not Found","detail":null}}';
    }
    location /api/ {
        types { }
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"Not Found","detail":null}}';
    }

    # index.html 은 캐시하지 않는다. 배포는 FE·BE 를 한 번에 바꾸는데, 캐시된 셸이 남으면
    # 열려 있던 탭이 구 번들로 새 API 계약을 계속 친다(응답 키가 사라져도 TS 가 못 잡는다).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # 해시가 박힌 자산은 영구 캐시 — 내용이 바뀌면 파일명이 바뀌므로 무효화가 필요 없다.
    # `always` 를 붙이지 않는다: 그러면 404 에도 1년 immutable 이 붙어, 배포 직전 셸을 든
    # 브라우저가 사라진 번들의 404 를 1년간 캐시한다(되돌릴 수 없다). 200·304 는 그대로 받는다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 022 — / 는 정적 랜딩(landing.html). 옛 링크(/?tab=…)는 쿼리를 들고 /app/ 로 301.
    # 랜딩도 캐시하지 않는다 — 스크립트가 /api/landing 계약을 따르므로 index.html 과 같은 이유.
    location = / {
        if ($args) { return 301 /app/$is_args$args; }
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /landing.html =404;
    }
    location = /app { return 301 /app/; }

    # 022 — 대시보드는 /app/ 아래. 빌드 결과(dist)는 그대로 root 에 있고 alias 로 접두만 벗긴다.
    # /app/assets/ 는 위 /assets/ 와 같은 영구 캐시, 없는 경로는 /app/index.html — SPA fallback.
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /app/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location /app/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /app/index.html;
    }

    # 그 밖의 루트 경로는 정적 파일(랜딩 이미지·robots.txt·favicon)만 — 없으면 404 (SPA fallback 은 /app/ 에서만)
    location / {
        try_files $uri =404;
    }
}

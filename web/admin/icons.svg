<svg xmlns="http://www.w3.org/2000/svg">
  <!-- KimpTrack 관리자 아이콘 묶음(스펙 066 §2) — 페이지가 <use href="icons.svg#이름"> 으로만 쓴다(같은 출처, 글꼴 아이콘·CDN 없음).
       직접 그린 24×24 단순 도형이고 색은 currentColor(둘레 글자색)를 따른다. 새 아이콘은 이 파일에만 더한다. -->
  <!-- 브랜드 마크(김치 항아리 속 스프레드, favicon.svg 의 32 격자를 3/4 로) — 몸통은 옅게, 뚜껑·스프레드 선·두 점은 진하게 -->
  <symbol id="logo" viewBox="0 0 24 24">
    <g transform="scale(.75)" fill="currentColor">
      <path d="M12.2 9.6 L 19.8 9.6 C 25.6 11 27 16.4 25.4 21.4 C 24.2 25.2 20.6 26.8 16 26.8 C 11.4 26.8 7.8 25.2 6.6 21.4 C 5 16.4 6.4 11 12.2 9.6 Z" opacity=".24"/>
      <rect x="10.6" y="5.6" width="10.8" height="2.8" rx="1.4"/>
      <line x1="14.6" y1="21.2" x2="24" y2="21.2" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.5 1.7" stroke-linecap="round" opacity=".7"/>
      <line x1="11.2" y1="21.2" x2="20.6" y2="14.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="11.2" cy="21.2" r="2.4"/>
      <circle cx="20.6" cy="14.2" r="2.4"/>
    </g>
  </symbol>
  <symbol id="overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/>
    <rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/>
  </symbol>
  <symbol id="server" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.6"/>
    <path d="M7.5 7.25h.01M7.5 16.75h.01M11.5 7.25h5M11.5 16.75h5"/>
  </symbol>
  <symbol id="traffic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12.5h3.5l2.6-6.5 4.2 12 2.7-5.5H21"/>
  </symbol>
  <symbol id="visitors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.5 3.4 5.3 3.4 8.5s-1.1 6-3.4 8.5c-2.3-2.5-3.4-5.3-3.4-8.5S9.7 6 12 3.5z"/>
  </symbol>
  <symbol id="clarity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="screens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8.5 20.5h7M12 17v3.5M3 8.5h18M8.5 8.5V17"/>
  </symbol>

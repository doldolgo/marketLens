<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>페이지를 찾을 수 없습니다 - KimpTrack</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="192x192" href="https://kimptrack.com/icon-192.png" />
  <meta name="theme-color" content="#161826" />
  <!-- 022 — 없는 경로의 안내(nginx error_page 404). 상태 코드는 404 그대로, 색인하지 않는다. 글꼴은 시스템 글꼴 -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #161826; color: #e9e9ed; font: 17px/1.7 -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; word-break: keep-all; }
    main { width: min(560px, 100% - 40px); }
    h1 { margin: 0; font-size: 28px; line-height: 1.35; letter-spacing: -0.02em; }
    p { margin: 12px 0 0; color: #cfd3e5; }
    nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 28px; }
    a { color: #9184d9; text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다.</p>
    <nav aria-label="바로 가기">
      <a href="/">KimpTrack 첫 화면</a>
      <a href="/app/">실시간 김프 표</a>
    </nav>
  </main>
</body>
</html>

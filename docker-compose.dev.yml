# 개발용 compose — InfluxDB 2.7 하나만 (스펙 005 §3.1). 배포용 compose 는 스펙 007 몫.
# 기동: docker compose --env-file server/.env -f docker-compose.dev.yml up -d
#   토큰을 파일 한 곳(server/.env)에만 두기 위해 값은 compose 변수 치환으로 온다.
#   첫 기동(setup)이 org·bucket `marketlens` 를 만들고 admin 토큰을 INFLUX_TOKEN 으로 맞춘다.
services:
  influxdb:
    image: influxdb:2.7
    container_name: marketlens-influxdb-dev
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: marketlens
      # UI 로그인(사람용)도 .env 의 토큰 값 하나로 통일한다
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: marketlens
      DOCKER_INFLUXDB_INIT_BUCKET: marketlens
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      # retention 무제한 — dw_fail 의 "최근 24시간" 은 쿼리 range 로 처리한다 (db.md)
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  influxdb-data:

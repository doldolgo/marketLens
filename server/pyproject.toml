[project]
name = "marketlens-server"
version = "0.1.0"
description = "MarketLens backend — 김프 수집·조회 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "influxdb-client>=1.45",
    "pyjwt>=2.8",
    "boto3>=1.34",
    # 바이낸스 깊이 스트림(012). uvicorn[standard] 의 전이 의존으로도 들어오지만
    # CI·Dockerfile 두 설치 경로 모두를 보장하려면 직접 의존으로 적어야 한다.
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "app"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: 한국어 메시지·주석이 길어지므로 줄 길이는 잡지 않는다 (conventions.md)
ignore = ["E501"]

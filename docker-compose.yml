# 배포용 compose — server·api·web·influxdb·redis 5컨테이너 (스펙 007·009·016). dev 는 docker-compose.dev.yml(Influx+Redis).
# 기동(EC2): docker compose --env-file .env --env-file server/.env up -d --build
#   WEB_PORT 는 루트 .env 에서, INFLUX_TOKEN 은 server/.env 에서 치환된다.
#   --env-file 을 명시하면 기본 ./.env 자동 로드가 꺼지므로 둘 다 적는다.
# 호스트에 여는 포트는 web 하나(${WEB_PORT:-80}) — server·api·influx·redis 는 compose 내부 네트워크만.

# 프로젝트 이름 고정 — 같은 폴더의 dev compose(프로젝트=폴더명)와 influxdb 서비스명이 겹쳐
# 서로의 컨테이너를 재생성하는 사고를 막고, EC2 폴더명(~/marketlens)과도 일치시킨다.
name: marketlens

services:
  server:
    build: ./server
    container_name: marketlens-server
    restart: unless-stopped
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 시크릿은 이미지가 아니라 여기서만 주입된다 — 이미지 레이어에 .env 없음 (스펙 007 §3)
    env_file:
      - ./server/.env
    environment:
      # 컨테이너 안에서 Influx 는 서비스명으로 접근 — server/.env 의 localhost 값을 덮는다
      INFLUX_URL: http://influxdb:8086
      # 틱 버퍼 Redis(009)도 서비스명으로 — server/.env 의 localhost 값을 덮는다
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - influxdb
      - redis

  # Influx 조회 전용 프로세스(스펙 016) — server 와 같은 이미지, ROLE 만 다르다. 무거운 /history 조회의
  # CPU·메모리가 수집 프로세스의 이벤트 루프·RSS 를 차지하지 않게 갈랐다. 거래소·Redis·S3 에 붙지 않는다.
  api:
    build: ./server
    container_name: marketlens-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./server/.env
    environment:
      ROLE: api
      INFLUX_URL: http://influxdb:8086
      # REDIS_URL 은 덮지 않는다 — api 는 Redis 를 쓰지 않는다(env_file 의 로컬 값은 무시된다)
    depends_on:
      - influxdb

  web:
    build: ./web
    container_name: marketlens-web
    restart: unless-stopped
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      # 호스트 포트는 루트 .env 의 WEB_PORT (EC2 는 80)
      - "${WEB_PORT:-80}:80"
    # nginx 가 두 upstream(server·api)을 기동 시 이름으로 푼다 — 둘 다 먼저 떠 있어야 한다
    depends_on:
      - server
      - api

  influxdb:
    image: influxdb:2.7
    container_name: marketlens-influxdb
    restart: unless-stopped
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # dev compose 와 같은 첫 기동 설정 — org·bucket marketlens, admin 토큰 = INFLUX_TOKEN
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: marketlens
      # UI 로그인(사람용)도 .env 의 토큰 값 하나로 통일한다
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: marketlens
      DOCKER_INFLUXDB_INIT_BUCKET: marketlens
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      # retention 무제한 — dw_fail 의 "최근 24시간" 은 쿼리 range 로 처리한다 (db.md)
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  redis:
    image: redis:7-alpine
    container_name: marketlens-redis
    restart: unless-stopped
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # AOF — 재기동해도 Influx 로 아직 안 옮긴 틱이 남는다 (009 §3.4). 호스트 비노출.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  influxdb-data:
  redis-data:

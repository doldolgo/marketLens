# 배포용 compose — server·api·web·caddy·influxdb·redis + cloudflared 7컨테이너 (스펙 007·009·016·021·023·030). dev 는 docker-compose.dev.yml(Influx+Redis).
# 030 — cloudflared 는 박스 profile 이 아니라 profile tunnel(serve 부속). 배포가 토큰 파일이 있을 때만 따로 띄우고,
#   로컬 통합 기동(COMPOSE_PROFILES=collect,data,serve)은 띄우지 않는다.
# 021 — 박스(EC2) 3대에 나눠 뜬다. 서비스마다 profile 이 하나씩이라 profile 없이 up 하면 아무것도 안 뜬다
#   (실수로 여섯이 한 박스에 뜨는 사고 방지). 박스별 기동:
#   docker compose --profile <collect|data|serve> --env-file .env --env-file server/.env up -d --build
#   로컬 통합 기동(예전처럼 여섯이 한 망에): COMPOSE_PROFILES=collect,data,serve 로 위 명령(--profile 생략).
#   WEB_PORT·DATA_HOST·COLLECT_HOST 는 루트 .env 에서, INFLUX_TOKEN 은 server/.env 에서 치환된다.
#   --env-file 을 명시하면 기본 ./.env 자동 로드가 꺼지므로 둘 다 적는다.
# 박스 간 주소는 루트 .env 의 DATA_HOST(=data 박스 사설 IP)·COLLECT_HOST(=collect 박스 사설 IP).
#   기본값이 서비스 이름이라 두 키를 안 주면 007 의 한 박스 동작 그대로다.
# depends_on 은 없다 — 의존 대상이 다른 박스에 있다. 저장소가 늦게 떠도 server 는 재시도한다(3.5 엣지).
# 호스트에 여는 포트: web ${WEB_PORT:-80} / server 8000 / redis 6379 / influxdb 8086 — 뒤 셋은 다른 박스에서
#   붙기 위해 열고 보안그룹이 막는다(8000 은 serve 에서만, 6379·8086 은 collect·serve 에서만). api 는 비공개.

# 프로젝트 이름 고정 — 같은 폴더의 dev compose(프로젝트=폴더명)와 influxdb 서비스명이 겹쳐
# 서로의 컨테이너를 재생성하는 사고를 막고, EC2 폴더명(~/marketlens)과도 일치시킨다.
name: marketlens

services:
  server:
    build: ./server
    container_name: marketlens-server
    restart: unless-stopped
    # 021 — collect 박스(c7g.medium) 전용. 수집기가 코어 1개를 온전히 쓴다.
    profiles: [collect]
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 시크릿은 이미지가 아니라 여기서만 주입된다 — 이미지 레이어에 .env 없음 (스펙 007 §3)
    env_file:
      - ./server/.env
    environment:
      # 컨테이너 안에서 Influx 는 data 박스 사설 IP(DATA_HOST) 로 — 없으면 서비스명(한 박스). server/.env 의 localhost 값을 덮는다
      INFLUX_URL: http://${DATA_HOST:-influxdb}:8086
      # 틱 버퍼 Redis(009)도 같은 규칙 — server/.env 의 localhost 값을 덮는다
      REDIS_URL: redis://${DATA_HOST:-redis}:6379/0
      # 029 — 관리자 페이지의 API 문서(/api/docs)가 /api/openapi.json 을 부르고 스키마의 서버 주소가 /api 가 되게.
      # nginx 가 접두를 뗀 경로(/health)와 박스 안 localhost:8000/… 는 그대로 라우팅된다. api 에는 주지 않는다.
      # 공개 nginx 의 /api/ 가 백엔드로 넘기지 않는 동안(028)만 안전하다 — 넘기면 인터넷에서 Try it out 이 된다
      UVICORN_ROOT_PATH: /api
      # 034 — 관리자 AWS 요약(/admin/aws·/admin/alerts 의 경보 이력)의 리전. 자격증명은 collect 박스 역할(010)이라
      # 수집기에만 준다. 비면 네 부분이 unconfigured 이고 AWS 를 부르지 않는다(로컬 uvicorn·api)
      ADMIN_AWS_REGION: ap-northeast-2
    ports:
      # serve 박스의 nginx 가 사설 IP 로 붙는다 — 보안그룹이 serve 그룹 외 인바운드를 막는다 (021 §3.1)
      - "8000:8000"

  # Influx 조회 전용 프로세스(스펙 016) — server 와 같은 이미지, ROLE 만 다르다. 무거운 /history 조회의
  # CPU·메모리가 수집 프로세스의 이벤트 루프·RSS 를 차지하지 않게 갈랐다. 거래소·Redis·S3 에 붙지 않는다.
  api:
    build: ./server
    container_name: marketlens-api
    restart: unless-stopped
    # 021 — serve 박스(t4g.micro). web 과 같은 박스라 nginx 가 서비스명으로 푼다.
    profiles: [serve]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - ./server/.env
    environment:
      ROLE: api
      INFLUX_URL: http://${DATA_HOST:-influxdb}:8086
      # 017 — 스프레드 표 구독(pub/sub)용. 안 덮으면 env_file 의 로컬 값(localhost)을 컨테이너 안에서 쓴다
      REDIS_URL: redis://${DATA_HOST:-redis}:6379/0
      # 027 — WS 접속 수 게이지(10초마다 UDP 1줄)를 serve 호스트의 CloudWatch Agent(StatsD :8125)로.
      # 에이전트가 없으면 UDP 가 버려질 뿐이다. collector(server)에는 주지 않는다 — 늘 0 이라 api 값을 덮는다.
      STATSD_ADDR: host.docker.internal:8125
    extra_hosts:
      # 027 — 위 이름을 호스트 게이트웨이(docker0)로. 에이전트는 호스트에 설치돼 있다(컨테이너 아님)
      - "host.docker.internal:host-gateway"

  web:
    build: ./web
    container_name: marketlens-web
    restart: unless-stopped
    # 021 — serve 박스. api 와 같은 박스.
    profiles: [serve]
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # 023 — 호스트 포트는 caddy 가 쥔다(80·443). web 은 같은 망의 caddy 만 부르므로 호스트에 열지 않는다.
    # 029 — 관리자 server :8081 도 게시하지 않는다(어떤 서비스도). 박스 안에서만 닿고, 들어오는 길은 030.
    volumes:
      # 029 — 관리자 접속 기록(JSON 한 줄씩) → 호스트 ./logs/admin/access.log (git 무시, 회전은 030 런북).
      # /var/log/nginx 를 통째로 바인드하지 않는다 — 이미지의 stdout·stderr 링크가 가려진다
      - ./logs/admin:/var/log/nginx-admin
    environment:
      # 021 — nginx 허용 목록(028)·관리자 server(029) 중 수집기로 가는 location 의 업스트림. collect 박스 사설 IP, 없으면 서비스명(한 박스).
      # nginx 이미지의 entrypoint 가 /etc/nginx/templates/*.template 을 envsubst 해 conf.d 에 쓴다(web/Dockerfile).
      COLLECT_HOST: ${COLLECT_HOST:-server}
      # envsubst 대상을 이 한 변수로 제한 — nginx 자체 변수($http_host·$http_upgrade…)가 치환되지 않게
      NGINX_ENVSUBST_FILTER: ^COLLECT_HOST$$
    networks:
      # 030 — 기본 망(caddy·api 와)과 관리자 터널 망 admin(cloudflared 와) 두 곳. cloudflared 는 admin 에만 있어
      # compose 이름으로는 web 하나만 푼다 — api·caddy 에 닿는 길이 없다.
      - default
      - admin

  # 030 — 관리자 페이지(admin.kimptrack.com)로 들어오는 유일한 길. serve 박스에서 Cloudflare 로 밖으로만 연결하고,
  # Access 로그인을 통과한 요청만 web 관리자 server(:8081)로 넘긴다. 인바운드 포트 없음. 설정은 대시보드(runbooks/admin-access.md).
  cloudflared:
    # 태그 + 멀티 아키텍처 인덱스 digest — serve 는 arm64 라 한 플랫폼 digest 를 박으면 exec format error.
    # latest 금지, 분기마다 올린다(런북 "이미지 갱신"). 2025.4.0 이상이어야 토큰 파일을 읽는다.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    container_name: marketlens-cloudflared
    restart: unless-stopped
    # 박스 profile 이 아니다 — serve 배포가 공개 up 과 따로, 토큰 파일이 있을 때만 띄운다 (030 §3.3)
    profiles: [tunnel]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # t4g.micro(1GB + 스왑) — 부풀거나 새도 같은 박스의 api·web 몫을 먹지 않게. 실제 사용량은 배포 뒤 docker stats 로 본다.
    # memswap_limit 을 같은 값으로 — 안 주면 docker 가 스왑을 같은 양 더 허락해 api·web 과 나눠 쓰는 스왑 1GB(027)를 먹는다
    mem_limit: 128m
    memswap_limit: 128m
    # 이미지 ENTRYPOINT 가 `cloudflared --no-autoupdate`. loglevel 은 info 고정 — debug 는 요청 헤더 전부
    # (쿠키·Access JWT·X-Refresh-Token)를 로그로 낸다. metrics 는 컨테이너 안 루프백 — 헬스체크만 부른다.
    command: ["tunnel", "--loglevel", "info", "--metrics", "127.0.0.1:2000", "run"]
    healthcheck:
      # exec 형식 — 이미지가 distroless(셸 없음)라 CMD-SHELL 은 늘 unhealthy 다. 연결이 하나라도 서야 0
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # 토큰은 파일로만 — 환경변수(TUNNEL_TOKEN)는 docker inspect·compose config 에 찍히고, server/.env 는 api·수집기에 들어간다
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared-token
    secrets:
      - cloudflared-token
    networks:
      - admin

  caddy:
    image: caddy:2-alpine
    container_name: marketlens-caddy
    restart: unless-stopped
    # 023 — serve 박스 TLS 앞단. kimptrack.com·www 는 Let's Encrypt 자동 발급, 그 밖의 호스트(IP 직접)는 평문 그대로 web 으로.
    profiles: [serve]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      # 호스트 포트는 루트 .env 의 WEB_PORT (EC2 는 80). 443 은 고정 — 인증서 발급(HTTP-01)도 80 으로 받는다.
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      # 027 — 디렉터리째 바인드. 파일 하나를 바인드하면 git 이 새 파일로 바꿔 써도 컨테이너는 옛 내용을 본다.
      # 설정 변경은 배포 워크플로가 up 뒤에 `caddy reload` 로 읽힌다(정의가 안 바뀐 caddy 는 compose 가 다시 만들지 않는다).
      - ./caddy:/etc/caddy:ro
      # 027 — 도메인 블록 접속 로그 → 호스트 ./logs/caddy/access.log (git 무시 — 배포의 reset --hard 는 추적 안 하는 파일을 안 지운다)
      - ./logs/caddy:/var/log/caddy
      # 인증서·ACME 계정 — 볼륨이 없으면 재배포마다 재발급해 Let's Encrypt 주간 한도(같은 도메인 5장)에 걸린다
      - caddy-data:/data
      - caddy-config:/config

  influxdb:
    image: influxdb:2.7
    container_name: marketlens-influxdb
    restart: unless-stopped
    # 021 — data 박스(t4g.small, 2GB + 스왑 1GB). redis 와 같은 박스.
    profiles: [data]
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # dev compose 와 같은 첫 기동 설정 — org·bucket marketlens, admin 토큰 = INFLUX_TOKEN
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: marketlens
      # UI 로그인(사람용)도 .env 의 토큰 값 하나로 통일한다
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: marketlens
      DOCKER_INFLUXDB_INIT_BUCKET: marketlens
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      # retention 무제한 — dw_fail 의 "최근 24시간" 은 쿼리 range 로 처리한다 (db.md)
      DOCKER_INFLUXDB_INIT_RETENTION: "0"
      # 021 — 메모리 상한(2026-09-28 사람 결정). 2026-09-07 기간 없는 streaks/bulk 가 Influx 를 2.4GB 까지 키워 OOM 4회.
      # 쿼리 1개 256MB × 동시 2개 = 전체 512MB(max 는 concurrency × memory 와 같아야 한다). 이 상한이 세는 메모리는
      # 실제 힙의 1/3~1/4 이고 거부되는 쿼리도 힙을 +0.8GB 올리므로, Go 힙 목표(GOMEMLIMIT 700MiB)와 쓰기 캐시(256MB)를
      # 따로 죄고 컨테이너 상한(mem_limit 1300m)을 건다 — 넘치면 Influx 만 재시작되고 Redis·OS 는 산다.
      # 박스 예산: Influx 1,300MiB + Redis 600MiB(maxmemory) = 1.9GiB, 둘이 함께 상한에 닿을 때 모자라는 OS·Redis 몫은 스왑 1GB 가 받는다(§3.1).
      # memswap_limit = mem_limit — Influx 는 스왑을 쓰지 않고 상한에서 바로 재시작된다(안 걸면 docker 가 같은 양의 스왑을 허락한다).
      INFLUXD_QUERY_MEMORY_BYTES: "268435456"
      INFLUXD_QUERY_MAX_MEMORY_BYTES: "536870912"
      INFLUXD_QUERY_CONCURRENCY: "2"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "268435456"
      GOMEMLIMIT: "700MiB"
    mem_limit: 1300m
    memswap_limit: 1300m
    ports:
      # collect(server)·serve(api) 박스가 사설 IP 로 붙는다 — 보안그룹이 두 그룹 외 인바운드를 막는다 (021 §3.1)
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2

  redis:
    image: redis:7-alpine
    container_name: marketlens-redis
    restart: unless-stopped
    # 021 — data 박스. influxdb 와 같은 박스.
    profiles: [data]
    # 컨테이너 로그 상한 — 회전이 없으면 json 로그가 디스크를 채우고, 디스크가 차면
    # Influx 가 쓰기를 거부한다(그 상태는 공간을 되찾아도 재시작 전까지 풀리지 않는다).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # AOF — 재기동해도 Influx 로 아직 안 옮긴 틱이 남는다 (009 §3.4).
    # maxmemory 600mb·noeviction(2026-09-28 사람 결정) — 틱 스트림 상한(MAXLEN 10,800 ≈ 0.44GB)을 넘는 일이 생겨도
    # 박스 전체가 아니라 쓰기만 거부된다(인계기는 그 틱을 버리고 경고한다). 키를 지우는 정책은 쓰지 않는다.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "600mb", "--maxmemory-policy", "noeviction"]
    ports:
      # collect(server)·serve(api) 박스가 사설 IP 로 붙는다 — 인증 없음, 보안그룹만 (021 §3.1·알려진 빚)
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  influxdb-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  # 030 — cloudflared 전용 망. web 만 함께 붙는다. 엣지로 나가야 하므로 internal 이 아니다.
  admin: {}

secrets:
  # 030 — 터널 토큰. serve 박스에만 두는 파일(git 무시), 소유 65532:65532·권한 0400 — 컨테이너가 UID 65532 로 돌고,
  # 파일 secret 은 바인드라 compose 의 uid·mode 지정이 무시된다. 비었거나 없으면 배포가 tunnel 을 건너뛴다.
  cloudflared-token:
    file: ./secrets/cloudflared-token
